# Extra flags for every Chrome launch. Read by the Arch google-chrome package's
# /usr/bin/google-chrome-stable wrapper (lines starting with # are dropped, the
# rest word-split onto the command line). Other packagings — NixOS, macOS,
# Windows — never read this file, so it is inert there.
#
# --no-default-browser-check: suppress the "Chrome isn't your default browser"
# infobar. Accepting it points http/https back at google-chrome.desktop, which
# bypasses open-link.sh (see dot_local/bin/executable_set-default-browser) and
# sends clicked links to whichever Chrome window was last active, usually on
# another workspace. set-default-browser repairs that only at login; this stops
# it happening mid-session.
--no-default-browser-check
