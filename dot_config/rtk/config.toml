[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-06-17T02:32:27.192486322+00:00"

[hooks]
# Net-negative under measurement: filtering saves ~0 tokens on these while
# driving excess re-runs (gh +17.1pp, find +11.3pp vs unfiltered baseline).
exclude_commands = ["gh", "find"]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
