general {
    # Draw the cursor while locked. Hidden, the lock screen reads as a machine
    # whose touchpad has died on resume — the keyboard visibly works, because
    # the PIN field takes input, so the pointer looks singled out and broken.
    hide_cursor = false
}

background {
    path = /home/chong/Pictures/Wallpaper/planet_with_sunrise.png
    blur_passes = 2
}

input-field {
    size = 250, 50
    outline_thickness = 2
    placeholder_text = PIN
    halign = center
    valign = center
}
