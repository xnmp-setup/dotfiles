# Class -> command for session restore.
# Format: class=command
#
# This is the ONLY way a plain application gets relaunched. Replaying the
# command line /proc reports was the obvious alternative and is a trap: /proc
# gives argv NUL-joined with its word boundaries already gone, so a path with a
# space comes back as a shell syntax error and anything containing ; or $( ) is
# re-executed as shell code at every login. It also reports what a process
# *became*, not what started it — Obsidian shows a bare electron invocation
# that skips the wrapper setting its environment.
#
# Ghostty, WezTerm and Chrome are not listed: each has a dedicated provider that
# knows how to make it restore its own contents.
#
# The key is the class hyprctl reports, not the binary name. A window whose
# class is missing here is logged at restore time as "never appeared" — add it.

com.lite_xl.LiteXL=lite-xl
Thunar=thunar
YouTube Music Desktop App=youtube-music-desktop-app
obsidian=obsidian
code=code
tauri-explorer=tauri-explorer
