# hypridle — idle actions. Launched from hyprland.lua's autostart block.
#
# Dim only. No dpms-off, no lock, no suspend: those are deliberately absent so
# an unattended screen stays readable and nothing gets torn down behind your
# back. Add listeners below if that changes.
#
# Depends on brightnessctl, which is outside this repo. On a machine with no
# backlight device it exits non-zero and hypridle just logs it, so this file is
# a harmless no-op on desktops rather than a breakage.

general {
    # false = respect idle inhibitors, so a fullscreen video or a running
    # meeting does not get dimmed out from under you.
    ignore_dbus_inhibit = false
}

listener {
    timeout = 120

    # -s stashes the *current* level before dimming so -r restores exactly what
    # was there. A hardcoded restore value would quietly overwrite whatever
    # brightness you had picked by hand.
    on-timeout = brightnessctl -s set 15%
    on-resume  = brightnessctl -r
}
