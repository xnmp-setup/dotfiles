# hypridle — idle actions. Launched from hyprland.lua's autostart block.
#
# The ladder, all timers measured from the last input:
#   2 min   dim the backlight
#   10 min  lock
#   10.5 min blank the panel
# and lock on the way into suspend, so closing the lid locks too.
#
# Locking leads blanking rather than following it. The screen must already be
# covered before it goes dark, because the moment it comes back is exactly when
# someone is looking at it — locking on resume paints the desktop first, for a
# frame or two, to whoever just opened the lid.
#
# Nothing here reaches a desktop. hyprland.lua only starts hypridle on a machine
# with a battery, and the two rules that would actually disrupt a desktop —
# locking and blanking — re-test for one themselves, so the guarantee holds even
# if something outside these dotfiles starts hypridle. The dim rule is left
# ungated: with no backlight to set, brightnessctl is already a no-op.
#
# Depends on brightnessctl and hyprlock, both outside this repo.

general {
    # lock.sh, never hyprlock directly: it wraps the lock to expire the cached
    # sudo ticket, and its own header notes that every path which locks the
    # screen has to go through it or sudo caches forever. The pidof guard keeps
    # a second lock from stacking on top of one already up — the idle timer and
    # a lid close can otherwise both fire.
    #
    # Guarded on /etc/pam.d/hyprlock because hyprlock without a PAM stack draws
    # a lock screen that cannot authenticate — the one failure here that is a
    # real lockout rather than an inconvenience. That file comes from outside
    # this repo (on the t14s, nixos-t14s; pam-hyprlock in this directory is the
    # reference copy), so a machine that has not installed it deliberately
    # fails open: no lock, rather than an unopenable one.
    #
    # The battery probe repeats hyprland.lua's gate on purpose. That gate only
    # covers hypridle started from these dotfiles; anything else that launches
    # it would read this file and start locking a desktop. Re-testing here makes
    # "laptop only" a property of the config rather than of who started it.
    lock_cmd = pidof hyprlock || ! [ -e /etc/pam.d/hyprlock ] || ! ls -d /sys/class/power_supply/BAT* >/dev/null 2>&1 || ~/.config/hypr/lock.sh

    # Lock on the way into suspend, so a closed lid is a locked machine.
    # hypridle holds a logind sleep inhibitor while this runs, so the lock is up
    # before the system actually goes down.
    before_sleep_cmd = loginctl lock-session

    # Suspend can leave the panel powered off on resume; this forces it back.
    after_sleep_cmd = hyprctl dispatch dpms on

    # false = respect idle inhibitors, so a fullscreen video or a running
    # meeting does not get dimmed or locked out from under you.
    ignore_dbus_inhibit = false
}

listener {
    timeout = 120

    # -s stashes the *current* level before dimming so -r restores exactly what
    # was there. A hardcoded restore value would quietly overwrite whatever
    # brightness you had picked by hand.
    on-timeout = brightnessctl -s set 15%
    on-resume  = brightnessctl -r
}

listener {
    timeout = 600
    # Via logind rather than calling lock.sh here, so that an explicit
    # `loginctl lock-session` from anywhere else takes the same path.
    on-timeout = loginctl lock-session
}

listener {
    # Trails the lock by 30s: enough for hyprlock to be drawn before the panel
    # goes dark, so unlocking never flashes the desktop underneath.
    timeout = 630
    # Battery-gated for the same reason as lock_cmd above: blanking is wanted
    # here to save a charge, and a desktop should not inherit it by way of
    # someone else's hypridle.
    on-timeout = ls -d /sys/class/power_supply/BAT* >/dev/null 2>&1 && hyprctl dispatch dpms off
    # Ungated: turning a display back on is always safe, and must still run if
    # the panel was blanked by anything other than the rule above.
    on-resume  = hyprctl dispatch dpms on
}
