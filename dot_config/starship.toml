"$schema" = 'https://starship.rs/config-schema.json'

# Two-line powerline prompt: blocks on line one, ❯ on line two.
#
# Colours come from a palette named per role (dir_bg, dir_fg, ...):
#   theme  generated by set-theme from the Ghostty theme (tinted on light
#          themes, dusk on dark ones; scripts/lib/starship-theme.sh).
#          ~/.config/zsh/starship-theme.zsh splices it into a copy of this
#          file and points STARSHIP_CONFIG at the copy.
#   ansi   the fallback below, used when no palette has been generated
#          (a machine where set-theme has not run, or no Ghostty theme).
# Exact hex colours also sidestep Ghostty's `bold-color = bright`, which
# swaps bold text on ANSI colours to the bright variant.
#
# Glyphs need a Nerd Font, as the p10k config does:  left cap,  arrow.
# Only the directory block is always present. Each later block can be absent,
# so it carries its own notch and arrow rather than joining its neighbour,
# whose colour it cannot know; that leaves a chevron-shaped gap between blocks.
#
# The directory is drawn from STARSHIP_PWD_HEAD/LEAF/RO, which the zsh helper
# exports before each prompt, because Starship cannot bold only the last
# folder name. In a shell without that helper the directory block is empty.

add_newline = true
# Keep this line exactly as written: starship-theme.zsh swaps it for
# palette = "theme" in the generated copy.
palette = "ansi"

format = """
[](fg:dir_bg)\
[ ](bg:dir_bg)\
${env_var.STARSHIP_PWD_HEAD}\
${env_var.STARSHIP_PWD_LEAF}\
${env_var.STARSHIP_PWD_RO}\
[ ](bg:dir_bg)\
[](fg:dir_bg)\
$git_branch\
([](fg:sync_bg inverted)$git_state$git_status[](fg:sync_bg))\
([](fg:lang_bg inverted)$nix_shell[](fg:lang_bg))\
${env_var.CHEZMOI}\
$status\
([](fg:dur_bg inverted)$cmd_duration$jobs[ ](bg:dur_bg)[](fg:dur_bg))\
$line_break\
$character"""

[palettes.ansi]
dir_bg = "blue"
dir_fg = "black"
branch_bg = "green"
branch_fg = "black"
sync_bg = "yellow"
sync_fg = "black"
lang_bg = "cyan"
lang_fg = "black"
err_bg = "red"
err_fg = "black"
dur_bg = "purple"
dur_fg = "black"
char_ok = "green"
char_err = "red"

[env_var.STARSHIP_PWD_HEAD]
format = "[$env_value](bg:dir_bg fg:dir_fg)"

[env_var.STARSHIP_PWD_LEAF]
format = "[$env_value](bg:dir_bg fg:dir_fg bold)"

[env_var.STARSHIP_PWD_RO]
format = "[ ](bg:dir_bg fg:dir_fg)"

[git_branch]
format = "[](fg:branch_bg inverted)[ $symbol$branch ](bg:branch_bg fg:branch_fg)[](fg:branch_bg)"
symbol = " "

[git_state]
format = "[ $state( $progress_current/$progress_total) ](bg:sync_bg fg:sync_fg)"

# Only commits ahead/behind the upstream branch; uncommitted changes, stashes
# and untracked files are deliberately not shown.
[git_status]
format = "([ $ahead_behind ](bg:sync_bg fg:sync_fg))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count} ⇣${behind_count}"
up_to_date = ""

[nix_shell]
format = "[ $symbol$state ](bg:lang_bg fg:lang_fg)"
symbol = " "
impure_msg = "nix"
pure_msg = "nix pure"

# `chezmoi cd` and `chezmoi edit` subshells export CHEZMOI=1; mark them so an
# exit isn't forgotten (p10k's chezmoi_shell segment did the same).
[env_var.CHEZMOI]
format = "[](fg:err_bg inverted)[ chezmoi ](bg:err_bg fg:err_fg)[](fg:err_bg)"

[status]
disabled = false
format = "[](fg:err_bg inverted)[ ✘ $status ](bg:err_bg fg:err_fg)[](fg:err_bg)"

[cmd_duration]
min_time = 3000
format = "[ $duration](bg:dur_bg fg:dur_fg)"

[jobs]
format = "[ $symbol$number](bg:dur_bg fg:dur_fg)"
symbol = "✦"
number_threshold = 1

[character]
success_symbol = "[❯](bold char_ok)"
error_symbol = "[❯](bold char_err)"
vimcmd_symbol = "[❮](bold char_ok)"
