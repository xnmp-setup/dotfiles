filetype: env

detect:
    filename: "(^|/)\\.env(\\.[^/]*)?$|\\.env$"

rules:
    # Everything right of the first "=" is the value.
    - constant.string: "=.*$"

    # Bare scalar values get their own colour.
    - constant.number: "=[[:space:]]*-?[0-9]+([.][0-9]+)?[[:space:]]*$"
    - constant.bool: "=[[:space:]]*([Tt]rue|TRUE|[Ff]alse|FALSE|[Nn]ull|NULL)[[:space:]]*$"

    # ${VAR} / $VAR interpolation inside values.
    - special: "\\$\\{[^}]*\\}|\\$[A-Za-z_][A-Za-z0-9_]*"

    # KEY, optionally preceded by "export".
    - identifier: "^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*"
    - statement: "^[[:space:]]*export\\b"
    - symbol.operator: "="

    - comment:
        start: "#"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME|NOTE):?"
