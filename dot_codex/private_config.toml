[mcp_servers.blender]
# Community Blender MCP addon (ahujasid/blender-mcp). Requires the "MCP for
# Blender" addon enabled in a GUI Blender with "Start MCP Server" clicked;
# the addon refuses to run under `blender --background`.
command = "/home/chong/.local/bin/uvx"
