model_reasoning_effort = "medium"

# Route sandbox-escalation approvals to the guardian reviewer agent instead of
# stopping for a human. Only applies while approvals are interactive
# (approval_policy = "on-request"); a no-op under "never". Must stay above the
# first [table] header or TOML nests it. Values: user | auto_review |
# guardian_subagent. NB: the published docs' [auto_review] table form does not
# parse in 0.145 — this key is top-level.
approvals_reviewer = "auto_review"

# Input-request toasts come from ~/.local/bin/agent-notify via the
# PreToolUse/request_user_input hook in ~/.codex/hooks.json. Keep the legacy
# turn-complete notify command unset so completions (including subagents)
# never raise desktop notifications.

[tui]
# agent-notify replaces the TUI's own OSC 9 notifications, which Ghostty
# forwards as a bare "Ghostty" toast carrying the reply's raw markdown. They
# are on by default.
notifications = false
# Publish the saved chat name as the native pane title. WezTerm consumes it
# directly; the Ghostty wrapper resolves the same name from the rename index
# while its custom OSC 2 renderer is active.
terminal_title = ["thread"]
# Codex 0.157 made the fullscreen transcript the default. Its PgUp/PgDn step is
# hardcoded to a full screen; keep inline mode so Ghostty scrollback (and the
# Hyprland half-page routing in hypr/page_key_routing.lua) keeps working.
fullscreen_transcript = false

# Keep the transcript available without intercepting terminal scroll keys.
[tui.keymap.global]
open_transcript = "alt-t"

# Lifecycle hooks are off by default; without this Codex silently ignores
# ~/.codex/hooks.json (terminal tab status and input-request notifications).
[features]
hooks = true

[projects."/home/chong/Repos/tauri-explorer"]
trust_level = "trusted"

[projects."/home/chong/Repos/autonomous-issue-agent"]
trust_level = "trusted"

[projects."/home/chong/.local/share/chezmoi"]
trust_level = "trusted"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

# Pre-trusted hashes for the hooks in ~/.codex/hooks.json, so a freshly
# provisioned machine runs them without a trust prompt. Tracked here only
# because both the hook definitions (.codex/hooks.json) and the scripts they
# invoke (.local/bin/wezterm-agent-status, .local/bin/agent-notify) are managed
# by this repo — the hashes describe content chezmoi itself installs. Regenerate
# these (delete the block, re-trust in Codex, copy back) whenever hooks.json
# changes, or the hooks go silently untrusted. A hash covers only the handler's
# own definition (event, matcher, command, timeout; not the script's contents):
# sha256 of the sorted, compact JSON of {"event_name": "<snake_case>",
# "matcher": ..., "hooks": [{"type": "command", "command": ..., "async": false,
# "timeout": 600}]}, per codex-rs/hooks/src/engine/discovery.rs hook_hash().
# The keys embed an absolute path, so they only match on a machine whose home
# is /home/chong.
[hooks.state]

[hooks.state."/home/chong/.codex/hooks.json:pre_tool_use:0:0"]
trusted_hash = "sha256:2fd69f9806e7e9729439fc0e9c7f1a8ff0c20cb3d9ca840d0eb09758bbd550e0"

[hooks.state."/home/chong/.codex/hooks.json:pre_tool_use:1:0"]
