# Tokyo Night
# Cool, neon-lit dark blue-purple theme inspired by Tokyo at night

[meta]
version = 1
name = "Tokyo Night"
description = "Cool, neon-lit dark blue-purple theme inspired by Tokyo at night"
variant = "dark"

[colors.core]
background = "#1A1B26"
foreground = "#C0CAF5"
secondary_background = "#24283B"
border = "#414868"
accent = "#7AA2F7"

[colors.accents]
blue = "#7AA2F7"
green = "#9ECE6A"
magenta = "#BB9AF7"
orange = "#FF9E64"
purple = "#BB9AF7"
red = "#F7768E"
yellow = "#E0AF68"
cyan = "#7DCFFF"

[colors.list.item.selection]
background = { name = "#414868", opacity = 0.55 }
secondary_background = "#33467C"

[colors.list.item.hover]
background = { name = "#414868", opacity = 0.35 }
