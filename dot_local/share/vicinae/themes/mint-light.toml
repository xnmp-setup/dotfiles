[meta]
version = 1
name = "Mint Light"
description = "Fresh mint-toned light palette with calm green accents"
variant = "light"

[colors.core]
background = "#F6FFF8"
foreground = "#3B413C"
secondary_background = "#EAF7EF"
border = "#C3DED0"
accent = "#1C8564"

[colors.accents]
blue = "#2D75A0"
green = "#3A8236"
magenta = "#B0507E"
orange = "#B05A22"
purple = "#93599F"
red = "#C24E36"
yellow = "#8F6D05"
cyan = "#137985"

[colors.list.item.selection]
background = { name = "#CDEFDD", opacity = 0.9 }
secondary_background = "#DDF0E5"

[colors.list.item.hover]
background = { name = "#C3DED0", opacity = 0.45 }
