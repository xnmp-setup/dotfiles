variant = "light"

[colors.core]
background = "#eff1f5"
foreground = "#4c4f69"
secondary_background = "#e6e9ef"
border = "#bcc0cc"
accent = "#8839ef"

[colors.accents]
blue = "#1e66f5"
green = "#40a02b"
