[meta]
version = 1
name = "Ayu Light"
description = "Omarchy's clean Ayu Light palette"
variant = "light"

[colors.core]
background = "#F8F9FA"
foreground = "#474C52"
secondary_background = "#EEF0F2"
border = "#B3B8BE"
accent = "#1B82CC"

[colors.accents]
blue = "#1B82CC"
green = "#4F9F2A"
magenta = "#8759B8"
orange = "#E25A5A"
purple = "#8759B8"
red = "#D9504F"
yellow = "#CF8A16"
cyan = "#2A9C78"

[colors.list.item.selection]
background = { name = "#C4D7F2", opacity = 0.9 }
secondary_background = "#DDE1E5"

[colors.list.item.hover]
background = { name = "#B3B8BE", opacity = 0.45 }
