# Everforest Light Medium
# Warm, earthy light theme with medium contrast (sainnhe/everforest)

[meta]
version = 1
name = "Everforest Light Medium"
description = "Warm, earthy light theme with medium contrast"
variant = "light"

[colors.core]
background = "#fdf6e3"
foreground = "#5c6a72"
secondary_background = "#f4f0d9"
border = "#e0dcc7"
accent = "#8da101"

[colors.accents]
blue = "#3a94c5"
green = "#8da101"
magenta = "#df69ba"
orange = "#f57d26"
purple = "#df69ba"
red = "#f85552"
yellow = "#dfa000"
cyan = "#35a77c"

[colors.list.item.selection]
background = { name = "#eaedc8", opacity = 0.9 }
secondary_background = "#efebd4"

[colors.list.item.hover]
background = { name = "#e0dcc7", opacity = 0.5 }
